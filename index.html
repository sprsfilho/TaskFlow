<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Gerenciador de tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <span class="logo-icon">T</span>
            <h1>TaskFlow</h1>
        </div>

        <div class="header-info">
            <span>Workspace pessoal</span>
        </div>
    </header>

    <main class="container">

        <section class="welcome">
            <div>
                <p class="subtitle">GERENCIAMENTO DE PROJETOS</p>
                <h2>Minhas tarefas</h2>
                <p class="description">
                    Organize suas atividades e acompanhe seu progresso.
                </p>
            </div>

            <div class="total-box">
                <span>Total de tarefas</span>
                <strong id="totalTasks">0</strong>
            </div>
        </section>

        <section class="toolbar">

            <form id="taskForm" class="task-form">

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Nome da tarefa..."
                    maxlength="80"
                    required
                >

                <input
                    type="text"
                    id="taskDescription"
                    placeholder="Descrição (opcional)"
                    maxlength="200"
                >

                <select id="taskPriority">
                    <option value="low">Baixa</option>
                    <option value="medium" selected>Média</option>
                    <option value="high">Alta</option>
                </select>

                <button type="submit" id="submitButton">
                    + Adicionar
                </button>

            </form>

            <input
                type="search"
                id="searchInput"
                class="search"
                placeholder="Pesquisar tarefas..."
            >

        </section>

        <section class="board">

            <div class="column" data-status="todo">
                <div class="column-header">
                    <h3>A fazer</h3>
                    <span class="count" id="todoCount">0</span>
                </div>

                <div class="task-list" id="todoList"></div>
            </div>

            <div class="column" data-status="progress">
                <div class="column-header">
                    <h3>Em andamento</h3>
                    <span class="count" id="progressCount">0</span>
                </div>

                <div class="task-list" id="progressList"></div>
            </div>

            <div class="column" data-status="done">
                <div class="column-header">
                    <h3>Concluído</h3>
                    <span class="count" id="doneCount">0</span>
                </div>

                <div class="task-list" id="doneList"></div>
            </div>

        </section>

        <footer>
            <p>TaskFlow © 2026 — Desenvolvido com HTML, CSS e JavaScript.</p>
        </footer>

    </main>

    <script src="main.js"></script>
</body>
</html>
